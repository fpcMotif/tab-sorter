<!-- @dsCard group="As built" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab Sorter — Status (As built)</title>
<style>
/* Chrome Native+ — approved design-token foundation shared by popup/App.css and
   options/App.css. Values are the token table in docs/design/final/DESIGN-SPEC.md
   §1, ground-truthed against the <style> blocks of docs/design/final/popup.html
   and settings.html. Replaces the prior Warm Editorial set. */

/* ---- Tokens: light (default) ---- */
:root {
  --font-sans:
    "Google Sans Text", "Google Sans", Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial,
    sans-serif;
  --font-display: "Google Sans", Roboto, -apple-system, "Segoe UI", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --page-bg: #e9edf3;
  --surface: #ffffff;
  --surface-container-lowest: #ffffff;
  --surface-container-low: #f8fafd;
  --surface-container: #f0f4f9;
  --surface-container-high: #e9eef6;
  --surface-container-highest: #e3e8f0;
  --on-surface: #1f1f1f;
  --on-surface-variant: #444746;
  --outline: #747775;
  --outline-variant: #c4c7c5;
  --primary: #0b57d0;
  --on-primary: #ffffff;
  --primary-container: #d3e3fd;
  --on-primary-container: #041e49;
  --error: #b3261e;
  --on-error: #ffffff;
  --error-container: #f9dedc;
  --on-error-container: #410e0b;
  --warning-container: #fef7e0;
  --on-warning-container: #7b5900;
  --success-container: #e6f4ea;
  --on-success-container: #0d652d;
  /* the 9 chrome.tabGroups colors — GroupColor in lib/types.ts */
  --g-grey-dot: #5f6368;
  --g-grey-bg: #e8eaed;
  --g-grey-fg: #3c4043;
  --g-blue-dot: #1a73e8;
  --g-blue-bg: #d2e3fc;
  --g-blue-fg: #0842a0;
  --g-red-dot: #d93025;
  --g-red-bg: #fce8e6;
  --g-red-fg: #a50e0e;
  --g-yellow-dot: #f29900;
  --g-yellow-bg: #fef7e0;
  --g-yellow-fg: #7b5900;
  --g-green-dot: #1e8e3e;
  --g-green-bg: #e6f4ea;
  --g-green-fg: #0d652d;
  --g-pink-dot: #d01884;
  --g-pink-bg: #fce4ec;
  --g-pink-fg: #7a0d4b;
  --g-purple-dot: #a142f4;
  --g-purple-bg: #f3e8fd;
  --g-purple-fg: #5e2b97;
  --g-cyan-dot: #12b5cb;
  --g-cyan-bg: #e0f7fa;
  --g-cyan-fg: #05707d;
  --g-orange-dot: #fa903e;
  --g-orange-bg: #fef0e6;
  --g-orange-fg: #8c3900;
  --shadow-color: 220 20% 20%;
  --elevation-1:
    0 1px 2px hsl(var(--shadow-color) / 0.3), 0 1px 3px 1px hsl(var(--shadow-color) / 0.15);
  --elevation-3:
    0 4px 8px 3px hsl(var(--shadow-color) / 0.15), 0 1px 3px hsl(var(--shadow-color) / 0.3);
  /* generic buckets over the per-component radii named in DESIGN-SPEC §1.5: s =
     domain row / inputs / small chips, m = dedupe row / toast, l = pills / cards */
  --radius-s: 10px;
  --radius-m: 14px;
  --radius-l: 20px;
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --dur: 140ms;
  /* On-primary chip inside the popup's hero-tidy button (DESIGN-SPEC §1.2/§4.1). */
  --hero-kbd-bg: hsl(0 0% 100% / 0.18);
  --hero-kbd-border: hsl(0 0% 100% / 0.32);
}

/* ---- Tokens: dark ---- */
@media (prefers-color-scheme: dark) {
  :root {
    --page-bg: #101114;
    --surface: #131314;
    --surface-container-lowest: #0e0e0e;
    --surface-container-low: #1b1b1b;
    --surface-container: #1e1f20;
    --surface-container-high: #282a2c;
    --surface-container-highest: #333537;
    --on-surface: #e3e3e3;
    --on-surface-variant: #c4c7c5;
    --outline: #8e918f;
    --outline-variant: #444746;
    --primary: #a8c7fa;
    --on-primary: #062e6f;
    --primary-container: #0842a0;
    --on-primary-container: #d3e3fd;
    --error: #f2b8b5;
    --on-error: #601410;
    --error-container: #8c1d18;
    --on-error-container: #f9dedc;
    --warning-container: #7b5900;
    --on-warning-container: #feefc3;
    --success-container: #0d652d;
    --on-success-container: #ceead6;
    --g-grey-dot: #9aa0a6;
    --g-grey-bg: #3c4043;
    --g-grey-fg: #dadce0;
    --g-blue-dot: #8ab4f8;
    --g-blue-bg: #0842a0;
    --g-blue-fg: #d2e3fc;
    --g-red-dot: #f28b82;
    --g-red-bg: #8c1d18;
    --g-red-fg: #fadad7;
    --g-yellow-dot: #fdd663;
    --g-yellow-bg: #7b5900;
    --g-yellow-fg: #feefc3;
    --g-green-dot: #81c995;
    --g-green-bg: #0d652d;
    --g-green-fg: #ceead6;
    --g-pink-dot: #ff8bcb;
    --g-pink-bg: #7a0d4b;
    --g-pink-fg: #ffd7ec;
    --g-purple-dot: #c58af9;
    --g-purple-bg: #5e2b97;
    --g-purple-fg: #ead9fc;
    --g-cyan-dot: #78d9ec;
    --g-cyan-bg: #05707d;
    --g-cyan-fg: #cbf0f8;
    --g-orange-dot: #fcad70;
    --g-orange-bg: #8c3900;
    --g-orange-fg: #fddbbd;
    --shadow-color: 220 40% 2%;
    --hero-kbd-bg: hsl(220 60% 10% / 0.16);
    --hero-kbd-border: hsl(220 60% 10% / 0.26);
  }
}

/* ---- Base elements ---- */
* {
  box-sizing: border-box;
}
body {
  background: var(--surface);
  color: var(--on-surface);
  font-family: var(--font-sans);
}
h1,
h2,
h3 {
  font-family: var(--font-display);
  font-weight: 500;
}
a {
  color: var(--primary);
}

/* ---- Buttons ---- */
button {
  background: var(--primary);
  border: 1px solid transparent;
  border-radius: var(--radius-l);
  box-shadow: var(--elevation-1);
  color: var(--on-primary);
  cursor: pointer;
  font: inherit;
  font-weight: 500;
  transition:
    background-color var(--dur) var(--ease),
    border-color var(--dur) var(--ease),
    box-shadow var(--dur) var(--ease),
    filter var(--dur) var(--ease),
    transform var(--dur) var(--ease);
}
button:hover:not(:disabled) {
  filter: brightness(1.06);
}
button:active:not(:disabled) {
  transform: scale(0.98);
}
button:disabled {
  cursor: default;
  opacity: 0.55;
}
.btn-secondary {
  background: transparent;
  border-color: var(--outline);
  box-shadow: none;
  color: var(--on-surface);
}
.btn-secondary:hover:not(:disabled) {
  background: var(--surface-container-high);
  filter: none;
}
.btn-danger {
  background: var(--error);
  border-color: transparent;
  color: var(--on-error);
}
.btn-ghost {
  background: transparent;
  border-color: transparent;
  box-shadow: none;
  color: var(--on-surface-variant);
}
.btn-ghost:hover:not(:disabled) {
  background: var(--surface-container-high);
  color: var(--on-surface);
  filter: none;
}

/* ---- Form controls ---- */
input,
select,
textarea {
  background: var(--surface-container-low);
  border: 1px solid var(--outline-variant);
  border-radius: var(--radius-s);
  color: var(--on-surface);
  font: inherit;
  transition: border-color var(--dur) var(--ease);
}
input:hover,
select:hover,
textarea:hover {
  border-color: var(--outline);
}

/* ---- Focus ---- */
:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

/* ---- Motion ---- */
@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
  }
}

/* ---- Utilities ---- */
.num {
  font-variant-numeric: tabular-nums;
}
/* Visually hidden but still reachable by assistive tech — for aria-live
   announcements (e.g. the popup's copy confirmation) that must never touch
   visible layout. */
.sr-only {
  border: 0;
  clip: rect(0, 0, 0, 0);
  height: 1px;
  margin: -1px;
  overflow: hidden;
  padding: 0;
  position: absolute;
  white-space: nowrap;
  width: 1px;
}
/* Kbd chip — DESIGN-SPEC §4.10, used by shortcut lists, chip shortcut hints,
   and the undo pill. */
kbd {
  background: var(--surface-container-high);
  border: 1px solid var(--outline-variant);
  border-radius: 5px;
  color: var(--on-surface-variant);
  font-family: var(--font-sans);
  font-size: 11px;
  padding: 2px 5px;
}
/* Group-color dot — one of the 9 GroupColor values (lib/types.ts), for the
   domain row and anywhere a group's color needs a plain identity mark. */
.dot {
  border-radius: 50%;
  flex: none;
  height: 10px;
  width: 10px;
}
.dot-grey {
  background: var(--g-grey-dot);
}
.dot-blue {
  background: var(--g-blue-dot);
}
.dot-red {
  background: var(--g-red-dot);
}
.dot-yellow {
  background: var(--g-yellow-dot);
}
.dot-green {
  background: var(--g-green-dot);
}
.dot-pink {
  background: var(--g-pink-dot);
}
.dot-purple {
  background: var(--g-purple-dot);
}
.dot-cyan {
  background: var(--g-cyan-dot);
}
.dot-orange {
  background: var(--g-orange-dot);
}

/* ---- Scrollbars ---- */
* {
  scrollbar-color: var(--outline-variant) transparent;
  scrollbar-width: thin;
}
*::-webkit-scrollbar {
  height: 8px;
  width: 8px;
}
*::-webkit-scrollbar-track {
  background: transparent;
}
*::-webkit-scrollbar-thumb {
  background: var(--outline-variant);
  border-radius: var(--radius-s);
}
*::-webkit-scrollbar-thumb:hover {
  background: var(--outline);
}

/* ---- As-built component card furniture (page chrome only) ---- */
body {
  margin: 0;
  padding: 32px 28px 64px;
  background: var(--page-bg);
}
.page-head {
  margin: 0 auto 28px;
  max-width: 860px;
}
.page-head h1 {
  color: var(--on-surface);
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 500;
  margin: 0 0 6px;
}
.page-head p {
  color: var(--on-surface-variant);
  font-size: 13px;
  line-height: 1.5;
  margin: 0;
  max-width: 640px;
}
.stage {
  margin: 0 auto;
  max-width: 1080px;
}
.demo-row {
  align-items: center;
  border-top: 1px solid var(--outline-variant);
  display: flex;
  flex-wrap: wrap;
  gap: 24px;
  padding: 18px 0;
}
.demo-row:first-of-type {
  border-top: none;
}
.demo-label {
  color: var(--on-surface-variant);
  flex: none;
  font-family: var(--font-mono);
  font-size: 11px;
  width: 100px;
}
.demo-sample {
  align-items: center;
  display: flex;
  flex: 1;
  flex-wrap: wrap;
  gap: 16px;
}
.demo-col-heads {
  color: var(--on-surface-variant);
  display: flex;
  font-size: 10.5px;
  gap: 16px;
  letter-spacing: 0.04em;
  padding: 0 0 8px 124px;
  text-transform: uppercase;
}
.demo-col-heads span {
  flex: none;
}

/* ---- Static state previews: same declarations as the real pseudo-class
   rules in tokens.css / popup/App.css / options/App.css, triggered by a
   class instead of a live :hover/:active/:focus-visible, since this page
   has no pointer or keyboard interaction driving it. ---- */
button.force-hover:not(:disabled) {
  filter: brightness(1.06);
}
button.force-active:not(:disabled) {
  transform: scale(0.98);
}
button.force-focus {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}
.btn-secondary.force-hover {
  background: var(--surface-container-high);
  filter: none;
}
.btn-ghost.force-hover {
  background: var(--surface-container-high);
  color: var(--on-surface);
  filter: none;
}
.btn-outline.force-hover {
  background: var(--surface-container-high);
  filter: none;
}
.hero-tidy.force-hover {
  filter: brightness(1.06);
}
.hero-tidy.force-focus {
  outline: 2px solid var(--on-primary-container);
  outline-offset: 2px;
}
.btn-danger-armed.force-focus {
  outline: 2px solid var(--error);
  outline-offset: 2px;
}
.chip-btn.force-hover {
  background: var(--surface-container-high);
  filter: none;
}
.domain-row.force-hover {
  background: var(--surface-container-low);
  filter: none;
}
.domain-row.force-focus {
  outline: 2px solid var(--primary);
  outline-offset: -1px;
}
input.force-hover,
select.force-hover {
  border-color: var(--outline);
}
input.force-focus,
select.force-focus {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}
.switch input:checked + .track {
  background: var(--primary);
}
.stepper button.force-hover {
  background: var(--surface-container-high);
  filter: none;
}

/* ---- Component rules below copied verbatim from
   apps/extension/entrypoints/popup/App.css ---- */
.toast-slot:empty {
  display: none;
}
.toast {
  align-items: flex-start;
  background: var(--g-green-bg);
  border-radius: 14px;
  color: var(--g-green-fg);
  display: flex;
  gap: 9px;
  padding: 10px;
}
.toast.is-error {
  background: var(--error-container);
  color: var(--on-error-container);
}
.toast svg {
  flex: none;
  height: 18px;
  margin-top: 1px;
  width: 18px;
}
.toast-body {
  flex: 1;
  font-size: 12.5px;
  line-height: 1.35;
}
.group-dots {
  display: inline-flex;
  gap: 3px;
  margin-left: 6px;
  vertical-align: middle;
}
.group-dots .dot {
  height: 6px;
  width: 6px;
}
.toast-close {
  align-items: center;
  background: transparent;
  border: none;
  border-radius: 50%;
  box-shadow: none;
  color: inherit;
  display: flex;
  flex: none;
  height: 22px;
  justify-content: center;
  opacity: 0.7;
  width: 22px;
}
.toast-close:hover:not(:disabled) {
  filter: none;
  opacity: 1;
}
.toast-close:focus-visible {
  outline: 2px solid currentColor;
  outline-offset: 1px;
}
.toast-close svg {
  height: 14px;
  width: 14px;
}
.undo-pill {
  align-items: center;
  align-self: flex-start;
  background: var(--primary-container);
  border: none;
  border-radius: 20px;
  box-shadow: none;
  color: var(--on-primary-container);
  display: inline-flex;
  font-size: 12.5px;
  font-weight: 500;
  gap: 6px;
  padding: 7px 14px 7px 12px;
}
.undo-pill:hover:not(:disabled) {
  filter: none;
}
.undo-pill svg {
  height: 15px;
  width: 15px;
}
.undo-pill kbd {
  margin-left: 2px;
}

/* Static state preview (see components/buttons.html comment) */
.toast-close.force-hover {
  filter: none;
  opacity: 1;
}

/* ---- This page's own furniture ---- */
.toast-stack {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 320px;
}
</style>
</head>
<body>
  <div class="page-head">
    <h1>Status — as shipped</h1>
    <p>The popup's shared toast slot (popup/App.tsx .toast-slot): a success toast with the tidy result's group-color dots echoed inline, an error toast, and the undo pill that can sit alongside either.</p>
  </div>
  <div class="stage">
    <div class="toast-stack">

      <div aria-live="polite" class="toast-slot" role="status">
        <div class="toast">
          <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="7.5 12.5 10.5 15.5 16.5 9"/></svg>
          <span class="toast-body">
            Grouped 18 tabs into 4 groups · 22 moved
            <span aria-hidden="true" class="group-dots">
              <span class="dot dot-blue"></span>
              <span class="dot dot-purple"></span>
              <span class="dot dot-orange"></span>
              <span class="dot dot-cyan"></span>
            </span>
          </span>
          <button aria-label="Dismiss" class="toast-close" type="button">
            <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" viewBox="0 0 24 24"><line x1="6" x2="18" y1="6" y2="18"/><line x1="18" x2="6" y1="6" y2="18"/></svg>
          </button>
        </div>
        <button class="undo-pill" type="button">
          <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><path d="M4.5 10.8a7.7 7.7 0 1 1 2 6.4"/><polyline points="4 4.5 4.5 10.8 10.7 10"/></svg>
          Undo
          <kbd>⌥⇧Z</kbd>
        </button>
      </div>

      <div aria-live="assertive" class="toast-slot" role="alert">
        <div class="toast is-error">
          <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><path d="M12 3.3 22 20H2z"/><line x1="12" x2="12" y1="9.5" y2="14.5"/><circle cx="12" cy="17.3" fill="currentColor" r=".9" stroke="none"/></svg>
          <span class="toast-body">Couldn't complete that action.</span>
          <button aria-label="Dismiss" class="toast-close force-hover" type="button">
            <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" viewBox="0 0 24 24"><line x1="6" x2="18" y1="6" y2="18"/><line x1="18" x2="6" y1="6" y2="18"/></svg>
          </button>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
