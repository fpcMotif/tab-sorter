<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 424" width="720" height="424" role="img" aria-labelledby="t d">
<title id="t">One seam, many surfaces</title>
<desc id="d">Six producers — popup, hotkeys, tabctl CLI, MCP tools, AI command bar, rules and recall — all lower intent into a single TabPlan IR, which a pure planner core realizes once through one Chrome adapter.</desc>
<defs>
<marker id="a" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#9a9486"/></marker>
</defs>
<rect x="0" y="0" width="720" height="424" rx="14" fill="#F6F4EF"/>
<text x="24" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#2E2A24">One seam, many surfaces</text>
<text x="24" y="52" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#6A6458">Every producer lowers intent to one TabPlan; the core realizes it once — with preview + undo at the seam.</text>

<g font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#3A463A" text-anchor="middle">
<rect x="24"  y="66" width="100" height="34" rx="8" fill="#EDF0EC" stroke="#CBD6C8"/><text x="74"  y="87">Popup</text>
<rect x="138" y="66" width="100" height="34" rx="8" fill="#EDF0EC" stroke="#CBD6C8"/><text x="188" y="87">Hotkeys / menu</text>
<rect x="252" y="66" width="100" height="34" rx="8" fill="#EDF0EC" stroke="#CBD6C8"/><text x="302" y="87">tabctl CLI</text>
<rect x="366" y="66" width="100" height="34" rx="8" fill="#EDF0EC" stroke="#CBD6C8"/><text x="416" y="87">MCP tools</text>
<rect x="480" y="66" width="100" height="34" rx="8" fill="#EDF0EC" stroke="#CBD6C8"/><text x="530" y="87">AI command bar</text>
<rect x="594" y="66" width="100" height="34" rx="8" fill="#EDF0EC" stroke="#CBD6C8"/><text x="644" y="87">rules · recall</text>
</g>

<g stroke="#C2BBAD" stroke-width="1.1" fill="none">
<path d="M74,100 L204,146"/><path d="M188,100 L268,146"/><path d="M302,100 L332,146"/>
<path d="M416,100 L396,146"/><path d="M530,100 L460,146"/><path d="M644,100 L524,146"/>
</g>

<rect x="150" y="148" width="420" height="54" rx="12" fill="#7A8B7A"/>
<text x="360" y="172" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#FFFFFF">TabPlan IR — the one seam</text>
<text x="360" y="191" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#E7EDE4">sort · group · move · close · stash · extract · restore · find</text>

<path d="M360,202 L360,224" stroke="#9a9486" stroke-width="2" fill="none" marker-end="url(#a)"/>

<rect x="190" y="226" width="340" height="48" rx="12" fill="#FCFBF9" stroke="#CBD6C8"/>
<text x="360" y="249" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13.5" fill="#2E2A24">Planner core — pure, tested</text>
<text x="360" y="266" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6A6458">minimal diff · preview · undo snapshot</text>

<path d="M360,274 L360,296" stroke="#9a9486" stroke-width="2" fill="none" marker-end="url(#a)"/>

<rect x="190" y="298" width="340" height="46" rx="12" fill="#F1EFE9" stroke="#E3DDD1"/>
<text x="360" y="320" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#3A352D">One adapter — the only chrome.* file</text>
<text x="360" y="336" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6A6458">tabs · windows · tabGroups · sessions</text>

<path d="M360,344 L360,366" stroke="#9a9486" stroke-width="2" fill="none" marker-end="url(#a)"/>

<rect x="282" y="368" width="156" height="34" rx="9" fill="#ECEAE3" stroke="#E3DDD1"/>
<text x="360" y="390" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#4A453B">Chrome runtime</text>
</svg>
