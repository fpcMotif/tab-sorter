<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tab Sorter Extension - Command Palette</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "surface": "#ffffff",
                        "surface-container-low": "#f9fafb",
                        "surface-container": "#f3f4f6",
                        "surface-container-high": "#e5e7eb",
                        "surface-container-highest": "#d1d5db",
                        "on-surface": "#111827",
                        "on-surface-variant": "#6b7280",
                        "outline-variant": "#e5e7eb",
                        "outline": "#9ca3af",
                        "primary": "#3b82f6",
                        "primary-container": "#eff6ff",
                        "on-primary-container": "#1d4ed8",
                        "secondary-fixed-dim": "#d1d5db",
                    },
                    "fontFamily": {
                        "sans": ["Inter", "sans-serif"],
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #EEF0F3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .popup-container {
            width: 360px;
            height: 460px;
            background-color: #ffffff;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
    </style>
</head>
<body>
<div class="popup-container">
<!-- Search / Command Input -->
<div class="flex items-center px-4 py-3 border-b border-outline-variant">
<span class="material-symbols-outlined text-on-surface-variant mr-3" style="font-size: 20px;">search</span>
<input class="flex-1 bg-transparent border-none p-0 text-sm font-medium text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0" placeholder="Search tabs, /regex/, or commands..." type="text"/>
<span class="text-[10px] font-medium text-on-surface-variant bg-surface-container px-1.5 py-0.5 rounded border border-outline-variant">14 tabs</span>
</div>
<!-- Main Content Area -->
<div class="flex-1 overflow-y-auto flex flex-col py-2">
<!-- Sort Section (Command Palette Style) -->
<div class="px-3 mb-2 flex items-center justify-between">
<span class="text-[10px] font-semibold text-on-surface-variant uppercase tracking-widest pl-1">Sort Mode</span>
<div class="flex gap-1">
<button class="px-2 py-1 bg-primary-container text-on-primary-container rounded text-xs font-medium border border-primary/20 flex items-center gap-1">
                A→Z by title
            </button>
<button class="px-2 py-1 text-on-surface-variant hover:bg-surface-container rounded text-xs font-medium flex items-center gap-1 transition-colors">
                By domain
            </button>
</div>
</div>
<!-- Domain List Section -->
<div class="px-3">
<span class="text-[10px] font-semibold text-on-surface-variant uppercase tracking-widest pl-1 mb-1 block">Extract to new window</span>
<div class="flex flex-col gap-0.5">
<!-- Item 1 (Selected / Highlighted) -->
<div class="flex items-center justify-between py-1.5 px-2 rounded-md bg-primary-container cursor-pointer border border-primary/10">
<div class="flex items-center gap-2.5">
<div class="w-1.5 h-1.5 rounded-full bg-primary"></div>
<span class="text-sm font-medium text-on-primary-container">github.com</span>
</div>
<div class="flex items-center gap-2">
<span class="text-[10px] font-medium text-on-primary-container bg-primary/10 px-1.5 py-0.5 rounded-sm">5 tabs</span>
<span class="text-[10px] text-primary opacity-60 font-medium">↵</span>
</div>
</div>
<!-- Item 2 -->
<div class="flex items-center justify-between py-1.5 px-2 rounded-md hover:bg-surface-container cursor-pointer transition-colors group">
<div class="flex items-center gap-2.5">
<div class="w-1.5 h-1.5 rounded-full bg-secondary-fixed-dim"></div>
<span class="text-sm text-on-surface group-hover:text-on-surface">figma.com</span>
</div>
<div class="flex items-center gap-2">
<span class="text-[10px] font-medium text-on-surface-variant bg-surface-container-high px-1.5 py-0.5 rounded-sm">4 tabs</span>
<span class="text-[10px] text-on-surface-variant opacity-40 font-medium opacity-0 group-hover:opacity-100">⌘ 2</span>
</div>
</div>
<!-- Item 3 -->
<div class="flex items-center justify-between py-1.5 px-2 rounded-md hover:bg-surface-container cursor-pointer transition-colors group">
<div class="flex items-center gap-2.5">
<div class="w-1.5 h-1.5 rounded-full bg-secondary-fixed-dim"></div>
<span class="text-sm text-on-surface group-hover:text-on-surface">google.com</span>
</div>
<div class="flex items-center gap-2">
<span class="text-[10px] font-medium text-on-surface-variant bg-surface-container-high px-1.5 py-0.5 rounded-sm">3 tabs</span>
<span class="text-[10px] text-on-surface-variant opacity-40 font-medium opacity-0 group-hover:opacity-100">⌘ 3</span>
</div>
</div>
<!-- Item 4 -->
<div class="flex items-center justify-between py-1.5 px-2 rounded-md hover:bg-surface-container cursor-pointer transition-colors group">
<div class="flex items-center gap-2.5">
<div class="w-1.5 h-1.5 rounded-full bg-secondary-fixed-dim"></div>
<span class="text-sm text-on-surface group-hover:text-on-surface">youtube.com</span>
</div>
<div class="flex items-center gap-2">
<span class="text-[10px] font-medium text-on-surface-variant bg-surface-container-high px-1.5 py-0.5 rounded-sm">2 tabs</span>
<span class="text-[10px] text-on-surface-variant opacity-40 font-medium opacity-0 group-hover:opacity-100">⌘ 4</span>
</div>
</div>
<!-- Item 5 -->
<div class="flex items-center justify-between py-1.5 px-2 rounded-md hover:bg-surface-container cursor-pointer transition-colors group">
<div class="flex items-center gap-2.5">
<div class="w-1.5 h-1.5 rounded-full bg-secondary-fixed-dim"></div>
<span class="text-sm text-on-surface group-hover:text-on-surface">news.ycombinator.com</span>
</div>
<div class="flex items-center gap-2">
<span class="text-[10px] font-medium text-on-surface-variant bg-surface-container-high px-1.5 py-0.5 rounded-sm">1 tab</span>
<span class="text-[10px] text-on-surface-variant opacity-40 font-medium opacity-0 group-hover:opacity-100">⌘ 5</span>
</div>
</div>
</div>
</div>
</div>
<!-- Footer -->
<div class="flex justify-between items-center px-4 py-2 mt-auto bg-surface-container-low border-t border-outline-variant">
<div class="flex items-center gap-2">
<span class="text-[10px] font-medium text-on-surface-variant bg-surface-container-high px-1 py-0.5 rounded border border-outline-variant/50">Alt</span>
<span class="text-[10px] font-medium text-on-surface-variant bg-surface-container-high px-1 py-0.5 rounded border border-outline-variant/50">S</span>
<span class="text-[10px] text-on-surface-variant">quick-sort tabs</span>
</div>
<div class="flex gap-3">
<a class="text-[11px] text-on-surface-variant hover:text-primary transition-colors" href="#">Help</a>
<a class="text-[11px] text-on-surface-variant hover:text-primary transition-colors" href="#">Settings</a>
</div>
</div>
</div>
</body></html>
