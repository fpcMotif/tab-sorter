<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tab Sorter Extension</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        midnight: '#0f0f11',
                        surface: '#18181b',
                        'surface-hover': '#27272a',
                        'surface-glass': 'rgba(24, 24, 27, 0.7)',
                        border: '#27272a',
                        'border-light': '#3f3f46',
                        accent: '#6366f1',
                        'accent-hover': '#818cf8',
                        'text-primary': '#f4f4f5',
                        'text-secondary': '#a1a1aa',
                        'text-tertiary': '#71717a',
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-image: radial-gradient(circle at 50% 0%, #1a1a2e 0%, #000000 70%);
        }
        .popup-container {
            width: 360px;
            height: 460px;
            background-color: rgba(15, 15, 17, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* Custom Scrollbar for dark theme */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #52525b;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="antialiased text-text-primary">
<div class="popup-container">
<!-- TopAppBar -->
<div class="flex justify-between items-center px-4 py-3 w-full bg-surface-glass backdrop-blur-md border-b border-border docked full-width top-0 z-10">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-accent text-xl" style="font-variation-settings: 'FILL' 1;">tabs</span>
<h1 class="text-sm font-semibold text-text-primary tracking-tight">Tab Sorter</h1>
</div>
<div class="flex items-center">
<span class="bg-surface border border-border text-text-secondary px-2 py-1 rounded-md text-[10px] font-medium tracking-wide uppercase">current window · 14 tabs</span>
</div>
</div>
<!-- Main Content -->
<div class="flex-1 overflow-y-auto p-4 flex flex-col gap-6">
<!-- Sorting Section -->
<div class="flex flex-col gap-2.5">
<span class="text-[10px] font-semibold text-text-tertiary uppercase tracking-widest pl-1">Sort</span>
<div class="flex bg-surface rounded-lg p-1 border border-border">
<button class="flex-1 bg-surface-hover py-1.5 px-3 rounded-md shadow-[0_1px_2px_rgba(0,0,0,0.2)] text-xs text-accent font-medium text-center transition-all ring-1 ring-border-light">A→Z by title</button>
<button class="flex-1 py-1.5 px-3 rounded-md text-xs text-text-secondary font-medium text-center hover:text-text-primary hover:bg-surface-hover/50 transition-colors">By domain</button>
</div>
</div>
<!-- Extraction Section -->
<div class="flex flex-col gap-2.5">
<span class="text-[10px] font-semibold text-text-tertiary uppercase tracking-widest pl-1">Extract to new window</span>
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-2.5 top-1/2 -translate-y-1/2 text-text-tertiary text-[16px]">search</span>
<input class="w-full h-8 pl-8 pr-3 rounded-md border border-border bg-surface text-xs focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-colors text-text-primary placeholder:text-text-tertiary shadow-inner" placeholder="/regex/ or text..." type="text"/>
</div>
<!-- Domain List -->
<div class="flex flex-col mt-2 gap-0.5">
<!-- Item 1 (Hovered equivalent) -->
<div class="flex items-center justify-between py-2 px-2.5 -mx-1 rounded-md bg-surface border border-border cursor-pointer transition-colors group">
<div class="flex items-center gap-2.5">
<div class="w-1.5 h-1.5 rounded-full bg-accent shadow-[0_0_8px_rgba(99,102,241,0.6)]"></div>
<span class="text-xs font-medium text-text-primary">github.com</span>
</div>
<span class="text-[10px] font-medium text-text-secondary bg-midnight border border-border px-1.5 py-0.5 rounded">5 tabs</span>
</div>
<!-- Item 2 -->
<div class="flex items-center justify-between py-2 px-2.5 -mx-1 rounded-md hover:bg-surface border border-transparent hover:border-border cursor-pointer transition-all group">
<div class="flex items-center gap-2.5">
<div class="w-1.5 h-1.5 rounded-full bg-border-light group-hover:bg-text-tertiary transition-colors"></div>
<span class="text-xs font-medium text-text-secondary group-hover:text-text-primary transition-colors">figma.com</span>
</div>
<span class="text-[10px] font-medium text-text-tertiary group-hover:text-text-secondary group-hover:bg-midnight group-hover:border-border border border-transparent px-1.5 py-0.5 rounded transition-all">4 tabs</span>
</div>
<!-- Item 3 -->
<div class="flex items-center justify-between py-2 px-2.5 -mx-1 rounded-md hover:bg-surface border border-transparent hover:border-border cursor-pointer transition-all group">
<div class="flex items-center gap-2.5">
<div class="w-1.5 h-1.5 rounded-full bg-border-light group-hover:bg-text-tertiary transition-colors"></div>
<span class="text-xs font-medium text-text-secondary group-hover:text-text-primary transition-colors">google.com</span>
</div>
<span class="text-[10px] font-medium text-text-tertiary group-hover:text-text-secondary group-hover:bg-midnight group-hover:border-border border border-transparent px-1.5 py-0.5 rounded transition-all">3 tabs</span>
</div>
<!-- Item 4 -->
<div class="flex items-center justify-between py-2 px-2.5 -mx-1 rounded-md hover:bg-surface border border-transparent hover:border-border cursor-pointer transition-all group">
<div class="flex items-center gap-2.5">
<div class="w-1.5 h-1.5 rounded-full bg-border-light group-hover:bg-text-tertiary transition-colors"></div>
<span class="text-xs font-medium text-text-secondary group-hover:text-text-primary transition-colors">youtube.com</span>
</div>
<span class="text-[10px] font-medium text-text-tertiary group-hover:text-text-secondary group-hover:bg-midnight group-hover:border-border border border-transparent px-1.5 py-0.5 rounded transition-all">2 tabs</span>
</div>
<!-- Item 5 -->
<div class="flex items-center justify-between py-2 px-2.5 -mx-1 rounded-md hover:bg-surface border border-transparent hover:border-border cursor-pointer transition-all group">
<div class="flex items-center gap-2.5">
<div class="w-1.5 h-1.5 rounded-full bg-border-light group-hover:bg-text-tertiary transition-colors"></div>
<span class="text-xs font-medium text-text-secondary group-hover:text-text-primary transition-colors">news.ycombinator.com</span>
</div>
<span class="text-[10px] font-medium text-text-tertiary group-hover:text-text-secondary group-hover:bg-midnight group-hover:border-border border border-transparent px-1.5 py-0.5 rounded transition-all">1 tab</span>
</div>
</div>
</div>
</div>
<!-- Footer -->
<div class="flex justify-between items-center px-4 py-3 w-full mt-auto bg-surface-glass backdrop-blur-md border-t border-border docked full-width bottom-0">
<span class="text-[11px] text-text-tertiary">Alt + S to quick-sort tabs</span>
<div class="flex gap-4">
<a class="text-[11px] text-text-tertiary hover:text-accent transition-colors" href="#">Help</a>
<a class="text-[11px] text-text-tertiary hover:text-accent transition-colors" href="#">Settings</a>
</div>
</div>
</div>
</body></html>
