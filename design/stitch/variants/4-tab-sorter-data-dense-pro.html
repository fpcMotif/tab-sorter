<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tab Sorter Extension</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#ffb695",
                        "on-primary-fixed-variant": "#3323cc",
                        "inverse-on-surface": "#f2f0f0",
                        "surface-container-highest": "#e3e2e2",
                        "error": "#ba1a1a",
                        "tertiary-container": "#a44100",
                        "on-primary-container": "#dad7ff",
                        "secondary": "#5f5e5e",
                        "on-tertiary": "#ffffff",
                        "tertiary": "#7e3000",
                        "primary-fixed-dim": "#c3c0ff",
                        "surface-container-low": "#f5f3f3",
                        "primary": "#3525cd",
                        "on-secondary-fixed": "#1c1b1b",
                        "secondary-fixed": "#e5e2e1",
                        "inverse-primary": "#c3c0ff",
                        "surface-bright": "#fbf9f9",
                        "surface": "#fbf9f9",
                        "outline": "#777587",
                        "secondary-container": "#e2dfde",
                        "secondary-fixed-dim": "#c8c6c5",
                        "outline-variant": "#c7c4d8",
                        "on-tertiary-fixed": "#351000",
                        "on-surface-variant": "#464555",
                        "tertiary-fixed": "#ffdbcc",
                        "primary-fixed": "#e2dfff",
                        "background": "#fbf9f9",
                        "on-primary-fixed": "#0f0069",
                        "surface-container": "#efeded",
                        "on-secondary-container": "#636262",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#e9e8e7",
                        "primary-container": "#4f46e5",
                        "surface-tint": "#4d44e3",
                        "inverse-surface": "#303031",
                        "surface-dim": "#dbdad9",
                        "on-secondary-fixed-variant": "#474746",
                        "surface-variant": "#e3e2e2",
                        "on-background": "#1b1c1c",
                        "error-container": "#ffdad6",
                        "on-secondary": "#ffffff",
                        "on-error": "#ffffff",
                        "on-surface": "#1b1c1c",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "on-tertiary-container": "#ffd2be"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "xl": "40px",
                        "margin-mobile": "16px",
                        "xs": "4px",
                        "gutter": "16px",
                        "md": "16px",
                        "margin-desktop": "32px",
                        "sm": "8px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "headline-sm-mobile": ["Inter"],
                        "label-xs": ["Inter"]
                    },
                    "fontSize": {
                        "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0em", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }],
                        "headline-sm": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-sm-mobile": ["16px", { "lineHeight": "22px", "fontWeight": "600" }],
                        "label-xs": ["11px", { "lineHeight": "12px", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #EEF0F3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }
        .popup-container {
            width: 360px;
            height: 460px;
            background-color: #ffffff;
            border-radius: 8px;
            border: 1px solid #c7c4d8;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body>
<div class="popup-container">
<!-- TopAppBar -->
<div class="flex justify-between items-center px-4 h-12 w-full bg-surface-container-lowest border-b border-outline-variant shrink-0">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-lg" style="font-variation-settings: 'FILL' 1;">tabs</span>
<h1 class="font-body-md text-sm font-semibold text-on-surface tracking-tight">Tab Sorter</h1>
</div>
<div class="flex items-center">
<span class="text-on-surface-variant font-label-xs text-[10px] uppercase tracking-widest font-semibold bg-surface-container py-1 px-2 rounded">14 tabs total</span>
</div>
</div>
<!-- Main Content -->
<div class="flex-1 overflow-y-auto p-4 flex flex-col gap-5 bg-surface-container-lowest">
<!-- Sorting Section -->
<div class="flex flex-col gap-1.5">
<span class="font-label-xs text-[10px] text-on-surface-variant uppercase tracking-widest font-semibold">Sort Strategy</span>
<div class="flex bg-surface-container rounded-md p-0.5 border border-outline-variant/30 h-8">
<button class="flex-1 bg-surface-container-lowest rounded shadow-sm font-body-sm text-xs text-primary font-medium border border-outline-variant/50 text-center transition-colors flex items-center justify-center">A→Z by title</button>
<button class="flex-1 rounded font-body-sm text-xs text-on-surface-variant text-center hover:bg-surface-container-low transition-colors flex items-center justify-center">By domain</button>
</div>
</div>
<!-- Extraction Section -->
<div class="flex flex-col gap-1.5">
<span class="font-label-xs text-[10px] text-on-surface-variant uppercase tracking-widest font-semibold">Extract / Filter</span>
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-2.5 top-1/2 -translate-y-1/2 text-on-surface-variant/70" style="font-size: 14px;">search</span>
<input class="w-full h-8 pl-8 pr-3 rounded-md border border-outline-variant bg-surface-container-lowest font-mono text-xs focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors text-on-surface placeholder:text-on-surface-variant/50 shadow-sm" placeholder="/regex/ or text..." type="text"/>
</div>
<!-- Domain List -->
<div class="flex flex-col mt-2">
<!-- Item 1 -->
<div class="flex items-center h-9 px-2 -mx-2 rounded hover:bg-surface-container cursor-pointer transition-colors group">
<div class="flex items-center gap-2 w-32 shrink-0">
<div class="w-1.5 h-1.5 rounded-full bg-primary/70"></div>
<span class="font-body-sm text-xs text-on-surface font-medium truncate">github.com</span>
</div>
<div class="flex-1 px-3 flex items-center">
<div class="h-1.5 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full" style="width: 36%;"></div>
</div>
</div>
<span class="font-mono text-[10px] text-on-surface-variant bg-surface-container-high px-1.5 py-0.5 rounded shrink-0">5 tabs</span>
</div>
<!-- Item 2 -->
<div class="flex items-center h-9 px-2 -mx-2 rounded hover:bg-surface-container cursor-pointer transition-colors group">
<div class="flex items-center gap-2 w-32 shrink-0">
<div class="w-1.5 h-1.5 rounded-full bg-outline"></div>
<span class="font-body-sm text-xs text-on-surface font-medium truncate">figma.com</span>
</div>
<div class="flex-1 px-3 flex items-center">
<div class="h-1.5 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-on-surface-variant/40 rounded-full" style="width: 28%;"></div>
</div>
</div>
<span class="font-mono text-[10px] text-on-surface-variant bg-surface-container-high px-1.5 py-0.5 rounded shrink-0">4 tabs</span>
</div>
<!-- Item 3 -->
<div class="flex items-center h-9 px-2 -mx-2 rounded hover:bg-surface-container cursor-pointer transition-colors group">
<div class="flex items-center gap-2 w-32 shrink-0">
<div class="w-1.5 h-1.5 rounded-full bg-outline"></div>
<span class="font-body-sm text-xs text-on-surface font-medium truncate">google.com</span>
</div>
<div class="flex-1 px-3 flex items-center">
<div class="h-1.5 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-on-surface-variant/40 rounded-full" style="width: 21%;"></div>
</div>
</div>
<span class="font-mono text-[10px] text-on-surface-variant bg-surface-container-high px-1.5 py-0.5 rounded shrink-0">3 tabs</span>
</div>
<!-- Item 4 -->
<div class="flex items-center h-9 px-2 -mx-2 rounded hover:bg-surface-container cursor-pointer transition-colors group">
<div class="flex items-center gap-2 w-32 shrink-0">
<div class="w-1.5 h-1.5 rounded-full bg-outline"></div>
<span class="font-body-sm text-xs text-on-surface font-medium truncate">youtube.com</span>
</div>
<div class="flex-1 px-3 flex items-center">
<div class="h-1.5 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-on-surface-variant/40 rounded-full" style="width: 14%;"></div>
</div>
</div>
<span class="font-mono text-[10px] text-on-surface-variant bg-surface-container-high px-1.5 py-0.5 rounded shrink-0">2 tabs</span>
</div>
<!-- Item 5 -->
<div class="flex items-center h-9 px-2 -mx-2 rounded hover:bg-surface-container cursor-pointer transition-colors group">
<div class="flex items-center gap-2 w-32 shrink-0">
<div class="w-1.5 h-1.5 rounded-full bg-outline"></div>
<span class="font-body-sm text-xs text-on-surface font-medium truncate">news.ycombinator.com</span>
</div>
<div class="flex-1 px-3 flex items-center">
<div class="h-1.5 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-on-surface-variant/40 rounded-full" style="width: 7%;"></div>
</div>
</div>
<span class="font-mono text-[10px] text-on-surface-variant bg-surface-container-high px-1.5 py-0.5 rounded shrink-0">1 tab</span>
</div>
</div>
</div>
</div>
<!-- Footer -->
<div class="flex justify-between items-center px-4 h-10 w-full mt-auto bg-surface-container border-t border-outline-variant shrink-0">
<span class="font-mono text-[10px] text-on-surface-variant">Alt + S to quick-sort tabs</span>
<div class="flex gap-3">
<a class="font-body-sm text-[11px] font-medium text-on-surface-variant hover:text-primary transition-colors" href="#">Help</a>
<a class="font-body-sm text-[11px] font-medium text-on-surface-variant hover:text-primary transition-colors" href="#">Settings</a>
</div>
</div>
</div>
</body></html>
