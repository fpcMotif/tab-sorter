<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tab Sorter — Copy popup (Soft Editorial)</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
  :root{--paper:#F6F4EF;--card:#FBFAF6;--paper-dim:#EFECE3;--hair:#E6E2D4;--hair-soft:#ECE8DD;--ink:#2C2C2C;--ink-2:#595959;--ink-3:#8C8C8C;--sage:#7A8B7A;--sage-deep:#526052;--sage-tint:#E6EBE6;--sage-line:#C9D4C9;--sage-badge:#D7E0D7;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:#E2DFD6;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;color:var(--ink);}
  .pop{width:344px;background:var(--paper);border:1px solid var(--hair);border-radius:14px;overflow:hidden;}
  .cap{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);}
  .row{display:flex;align-items:center;gap:11px;padding:11px 16px;}
  .badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;color:var(--ink-3);background:var(--paper-dim);}
</style></head>
<body>
<div class="pop">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--hair);">
    <span style="font-family:'Crimson Pro',serif;font-size:19px;font-weight:600;letter-spacing:-.01em;">Tab Sorter</span>
    <span style="color:var(--ink-3);font-size:14px;">sort &nbsp; settings</span>
  </div>
  <div style="padding:14px 16px 10px;">
    <div class="cap" style="margin-bottom:8px;">Scope</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
      <div class="row" style="justify-content:space-between;padding:8px 10px;border-radius:8px;background:var(--card);border:1px solid var(--hair);"><span style="font-size:13px;color:var(--ink-2);">Highlighted</span><span class="badge">3</span></div>
      <div class="row" style="justify-content:space-between;padding:8px 10px;border-radius:8px;background:var(--sage-tint);border:1px solid var(--sage-line);"><span style="font-size:13px;font-weight:500;color:var(--sage-deep);">This window</span><span class="badge" style="color:var(--sage-deep);background:var(--sage-badge);">12</span></div>
      <div class="row" style="justify-content:space-between;padding:8px 10px;border-radius:8px;background:var(--card);border:1px solid var(--hair);"><span style="font-size:13px;color:var(--ink-2);">All tabs</span><span class="badge">28</span></div>
      <div class="row" style="justify-content:space-between;padding:8px 10px;border-radius:8px;background:var(--card);border:1px solid var(--hair);"><span style="font-size:13px;color:var(--ink-2);">All windows</span><span class="badge">41</span></div>
    </div>
  </div>
  <div style="padding:4px 16px 6px;"><div class="cap">Format</div></div>
  <div style="border-top:1px solid var(--hair);">
    <div class="row" style="background:var(--paper-dim);">
      <span style="font-size:18px;color:var(--sage-deep);">&#128279;</span>
      <div style="flex:1;min-width:0;"><div style="font-size:14px;font-weight:500;">Link</div><div style="font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Clickable links · rich HTML</div></div>
      <span style="font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--sage-deep);background:var(--sage-badge);padding:2px 7px;border-radius:6px;">Default</span>
    </div>
    <div class="row" style="border-top:1px solid var(--hair-soft);"><span style="font-size:18px;color:var(--ink-3);">&#127760;</span><div style="flex:1;"><div style="font-size:14px;">URL</div></div></div>
    <div class="row" style="border-top:1px solid var(--hair-soft);"><span style="font-size:18px;color:var(--ink-3);">&#9776;</span><div style="flex:1;"><div style="font-size:14px;">Title and URL</div></div></div>
    <div class="row" style="border-top:1px solid var(--hair-soft);"><span style="font-size:18px;color:var(--ink-3);">M&#8595;</span><div style="flex:1;"><div style="font-size:14px;">Markdown</div></div></div>
    <div class="row" style="border-top:1px solid var(--hair-soft);"><span style="font-size:18px;color:var(--ink-3);">&#9636;</span><div style="flex:1;"><div style="font-size:14px;">CSV</div></div></div>
    <div class="row" style="border-top:1px solid var(--hair-soft);"><span style="font-size:18px;color:var(--ink-3);">{ }</span><div style="flex:1;"><div style="font-size:14px;">JSON</div></div></div>
  </div>
  <div style="padding:12px 16px;border-top:1px solid var(--hair);display:flex;align-items:center;gap:10px;">
    <button style="flex:1;background:var(--sage);color:var(--paper);border:none;border-radius:8px;padding:10px 12px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;">Copy 12 tabs as Link</button>
    <span style="font-size:11px;color:var(--ink-3);background:var(--card);border:1px solid var(--hair);border-radius:4px;padding:5px 7px;font-family:'JetBrains Mono',monospace;">&#8984;C</span>
  </div>
</div>
</body></html>
