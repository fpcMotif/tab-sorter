<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tab Sorter</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@500;600&family=Inter:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@100..900&family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 20px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#111f14",
                        "on-primary-fixed": "#101f13",
                        "on-primary-fixed-variant": "#3b4b3d",
                        "surface-dim": "#131412",
                        "surface-container-high": "#2a2a29",
                        "outline": "#8d928b",
                        "surface": "#131412",
                        "on-tertiary-fixed-variant": "#594045",
                        "inverse-surface": "#e4e2e0",
                        "on-secondary": "#253428",
                        "background": "#131412",
                        "surface-container-lowest": "#0e0e0d",
                        "tertiary-container": "#b39499",
                        "secondary": "#bacbba",
                        "tertiary-fixed-dim": "#e0bec3",
                        "surface-container-highest": "#343533",
                        "surface-container-low": "#1b1c1a",
                        "surface-variant": "#343533",
                        "tertiary": "#e0bec3",
                        "surface-tint": "#bacbb9",
                        "on-error-container": "#ffdad6",
                        "on-surface-variant": "#c3c8c0",
                        "surface-bright": "#393938",
                        "error-container": "#93000a",
                        "error": "#ffb4ab",
                        "inverse-primary": "#526253",
                        "on-tertiary": "#402a2f",
                        "secondary-container": "#3e4d3f",
                        "on-primary": "#253427",
                        "primary-fixed": "#d6e7d4",
                        "on-primary-container": "#28372a",
                        "primary": "#bacbb9",
                        "primary-fixed-dim": "#bacbb9",
                        "primary-container": "#8fa08f",
                        "on-surface": "#e4e2e0",
                        "on-background": "#e4e2e0",
                        "outline-variant": "#434843",
                        "inverse-on-surface": "#30312f",
                        "on-tertiary-container": "#442d32",
                        "on-secondary-fixed-variant": "#3b4a3d",
                        "on-secondary-container": "#acbdac",
                        "on-tertiary-fixed": "#29161a",
                        "secondary-fixed": "#d6e7d5",
                        "surface-container": "#1f201e",
                        "on-error": "#690005",
                        "secondary-fixed-dim": "#bacbba",
                        "tertiary-fixed": "#fddadf",
                        "brand-bg": "#18150F",
                        "brand-card": "#221E18",
                        "brand-border": "#38322B",
                        "brand-divider": "#2E2922",
                        "brand-text-primary": "#F3EFE7",
                        "brand-sage": "#8FA08F",
                        "brand-sage-light": "#A8B9A8"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "inline-gap": "12px",
                        "stack-gap-md": "16px",
                        "container-padding": "20px",
                        "stack-gap-lg": "24px",
                        "stack-gap-sm": "8px"
                    },
                    "fontFamily": {
                        "section-label": ["Inter"],
                        "headline-lg": ["Crimson Pro"],
                        "label-md": ["Inter"],
                        "headline-md": ["Crimson Pro"],
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "section-label": ["11px", {"lineHeight": "16px", "letterSpacing": "0.08em", "fontWeight": "600"}],
                        "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "label-md": ["13px", {"lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                        "headline-md": ["20px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "500"}],
                        "body-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0px", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                        "body-lg": ["15px", {"lineHeight": "24px", "letterSpacing": "0px", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-brand-bg min-h-screen flex items-center justify-center font-body-md text-on-surface-variant antialiased">
<!-- Main Container -->
<main class="w-[360px] h-[460px] bg-brand-card rounded-[12px] border border-brand-border flex flex-col overflow-hidden shadow-2xl shadow-black/20">
<!-- Header -->
<header class="flex justify-between items-center px-container-padding py-stack-gap-md border-b border-brand-border/30">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-brand-text-primary" data-icon="grid_view" style="font-variation-settings: 'FILL' 1;">grid_view</span>
<h1 class="font-headline-md text-headline-md text-brand-text-primary">Tab Sorter</h1>
</div>
<div class="px-2 py-1 rounded-full bg-brand-card border border-brand-border font-label-sm text-label-sm text-on-surface-variant flex items-center">
                current window · 14 tabs
            </div>
</header>
<!-- Content Area -->
<div class="flex-1 overflow-y-auto px-container-padding py-stack-gap-md flex flex-col gap-stack-gap-lg custom-scrollbar">
<!-- Sort Section -->
<section>
<h2 class="font-section-label text-section-label text-on-surface-variant uppercase mb-stack-gap-sm">SORT</h2>
<div class="flex bg-[#1D1914] p-1 rounded-lg border border-brand-border">
<button class="flex-1 py-1.5 px-3 rounded-md bg-brand-border/40 border border-brand-sage text-brand-sage-light font-label-sm text-label-sm flex justify-center items-center gap-1 transition-colors">
<span class="material-symbols-outlined text-[16px]" data-icon="sort_by_alpha">sort_by_alpha</span>
                        A→Z by title
                    </button>
<button class="flex-1 py-1.5 px-3 rounded-md text-on-surface-variant hover:text-on-surface font-label-sm text-label-sm transition-colors">
                        By domain
                    </button>
</div>
</section>
<!-- Extract Section -->
<section>
<h2 class="font-section-label text-section-label text-on-surface-variant uppercase mb-stack-gap-sm">EXTRACT TO NEW WINDOW</h2>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[16px]" data-icon="search">search</span>
<input class="w-full bg-[#1D1914] border border-brand-border rounded-lg py-2 pl-9 pr-3 text-brand-text-primary font-body-md text-body-md focus:outline-none focus:border-brand-sage focus:ring-1 focus:ring-brand-sage placeholder:text-on-surface-variant/50 transition-colors" placeholder="/regex/ or text…" type="text"/>
</div>
</section>
<!-- Domain List -->
<section class="flex flex-col">
<ul class="flex flex-col border-t border-brand-divider">
<!-- Item 1 (Hovered State) -->
<li class="flex justify-between items-center py-3 border-b border-brand-divider bg-brand-sage/10 cursor-pointer px-2 -mx-2 rounded-md">
<div class="flex items-center gap-3">
<div class="w-2 h-2 rounded-full bg-brand-sage"></div>
<span class="font-body-md text-body-md text-brand-text-primary">github.com</span>
</div>
<span class="px-2 py-0.5 rounded-full bg-[#1D1914] border border-brand-border font-label-sm text-label-sm text-on-surface-variant">5 tabs</span>
</li>
<!-- Item 2 -->
<li class="flex justify-between items-center py-3 border-b border-brand-divider hover:bg-brand-sage/5 cursor-pointer px-2 -mx-2 rounded-md transition-colors">
<div class="flex items-center gap-3">
<div class="w-2 h-2 rounded-full bg-brand-sage opacity-60"></div>
<span class="font-body-md text-body-md text-on-surface">figma.com</span>
</div>
<span class="px-2 py-0.5 rounded-full bg-[#1D1914] border border-brand-border font-label-sm text-label-sm text-on-surface-variant">4 tabs</span>
</li>
<!-- Item 3 -->
<li class="flex justify-between items-center py-3 border-b border-brand-divider hover:bg-brand-sage/5 cursor-pointer px-2 -mx-2 rounded-md transition-colors">
<div class="flex items-center gap-3">
<div class="w-2 h-2 rounded-full bg-brand-sage opacity-60"></div>
<span class="font-body-md text-body-md text-on-surface">google.com</span>
</div>
<span class="px-2 py-0.5 rounded-full bg-[#1D1914] border border-brand-border font-label-sm text-label-sm text-on-surface-variant">3 tabs</span>
</li>
<!-- Item 4 -->
<li class="flex justify-between items-center py-3 border-b border-brand-divider hover:bg-brand-sage/5 cursor-pointer px-2 -mx-2 rounded-md transition-colors">
<div class="flex items-center gap-3">
<div class="w-2 h-2 rounded-full bg-brand-sage opacity-60"></div>
<span class="font-body-md text-body-md text-on-surface">youtube.com</span>
</div>
<span class="px-2 py-0.5 rounded-full bg-[#1D1914] border border-brand-border font-label-sm text-label-sm text-on-surface-variant">2 tabs</span>
</li>
<!-- Item 5 -->
<li class="flex justify-between items-center py-3 border-b border-brand-divider hover:bg-brand-sage/5 cursor-pointer px-2 -mx-2 rounded-md transition-colors">
<div class="flex items-center gap-3">
<div class="w-2 h-2 rounded-full bg-brand-sage opacity-60"></div>
<span class="font-body-md text-body-md text-on-surface">news.ycombinator.com</span>
</div>
<span class="px-2 py-0.5 rounded-full bg-[#1D1914] border border-brand-border font-label-sm text-label-sm text-on-surface-variant">1 tab</span>
</li>
</ul>
</section>
</div>
<!-- Footer -->
<footer class="px-container-padding py-stack-gap-md border-t border-brand-border/30 bg-brand-card mt-auto flex justify-between items-center">
<p class="font-label-sm text-label-sm text-on-surface-variant/70">Click a domain to move its tabs into a new window.</p>
<span class="font-label-sm text-label-sm text-on-surface-variant/50">Press ⌘K to search</span>
</footer>
</main>
<style>
        /* Custom scrollbar for webkit to keep it minimal and non-intrusive */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #38322B;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: #434843;
        }
    </style>
</body></html>
